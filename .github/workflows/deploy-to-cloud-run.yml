name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'   # For Workload Identity Federation (recommended)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Recommended: Workload Identity Federation (no long-lived keys)
          workload_identity_provider: 'projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_POOL/providers/YOUR_PROVIDER'
          service_account: 'your-deploy-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com'

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'stock-agent'
          region: 'us-central1'
          # Uses the existing Dockerfile in the repo
          source: .
          # Or build and push image first if preferred
          flags: '--allow-unauthenticated --memory=4Gi --cpu=2 --timeout=600s'
